# Ruf durch (mai-stay-in-touch) — CI
# Linse: Secrets niemals im Repo · Fast Feedback · keine Kontaktdaten / kein Datenupload
name: CI

on:
  push:
    # Alle Branches: APK-Build früh validieren.
    branches: ["**"]
  pull_request:
    branches: [main]

# Nur lesen; keine Schreibrechte für Actions im CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  dart-packages:
    name: Backup format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [packages/mai_backup_format]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter (Dart SDK)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  build-apk:
    name: Release APK
    needs: [analyze-test, dart-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ubuntu-latest liefert ANDROID_HOME bereits (Runner-Image).
      # Kein android-actions/setup-android — das scheiterte im ersten Run.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee apk-build.log; then
            {
              echo "## APK build failed"
              echo
              echo '```text'
              # Kontext um den eigentlichen Fehler (nicht nur die FAILURE-Zeile)
              if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
                start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
                start=$((start > 5 ? start - 5 : 1))
                sed -n "${start},$((start + 40))p" apk-build.log
              else
                tail -n 120 apk-build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotationen: Fehlerblock, nicht die pub-outdated-Liste
            if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
              start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
              start=$((start > 2 ? start - 2 : 1))
              sed -n "${start},$((start + 25))p" apk-build.log
            else
              tail -n 30 apk-build.log
            fi | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '|' '/' | cut -c1-200)
              # Leere Zeilen und reine Trenner überspringen
              case "$safe" in
                ''|'---'*|'===') continue ;;
              esac
              echo "::error::$safe"
            done
            exit 1
          fi
        env:
          # Runner-RAM schonen; Daemon in CI ausschalten
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # Wear-OS-Begleit-App (android/wear): eigenes APK, gleicher Schlüssel.
      # gradlew legt `flutter build apk` an.
      - name: Build Wear OS APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :wear:assembleRelease 2>&1 | tee -a ../apk-build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK build log (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 7

      # Einheitlicher Name aller Mai-Apps: <repo>.apk
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mai-stay-in-touch.apk
          cp build/wear/outputs/apk/release/wear-release.apk mai-stay-in-touch-wear.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-stay-in-touch.apk
          path: mai-stay-in-touch.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wear OS APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-stay-in-touch-wear.apk
          path: mai-stay-in-touch-wear.apk
          if-no-files-found: error
          retention-days: 14

  # Play Store: signierte App Bundles (Telefon + Uhr) nur auf main und nur,
  # wenn die Signier-Secrets gesetzt sind — sonst bleibt alles wie bisher.
  # Schlüssel nie ins Repo; hier nur kurzlebig auf dem Runner.
  release-bundle:
    name: Signed release bundles (main)
    needs: [analyze-test, dart-packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Signier-Secrets gesetzt – kein signiertes App Bundle (siehe README, Release für den Play Store)."
          fi

      - name: Checkout
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        if: steps.signing.outputs.enabled == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        if: steps.signing.outputs.enabled == 'true'
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        if: steps.signing.outputs.enabled == 'true'
        run: flutter pub get

      # storeFile ist relativ zu android/app (siehe app/build.gradle.kts).
      - name: Write keystore and key.properties
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed app bundle (phone)
        if: steps.signing.outputs.enabled == 'true'
        run: flutter build appbundle --release
        env:
          # Bricht ab, statt still mit dem Debug-Key zu signieren.
          REQUIRE_RELEASE_SIGNING: "true"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build signed app bundle (Wear OS)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew :wear:bundleRelease
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Remove signing files
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Rename bundles
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cp build/app/outputs/bundle/release/app-release.aab mai-stay-in-touch.aab
          cp build/wear/outputs/bundle/release/wear-release.aab mai-stay-in-touch-wear.aab

      - name: Upload app bundles
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-stay-in-touch-aab
          path: |
            mai-stay-in-touch.aab
            mai-stay-in-touch-wear.aab
          if-no-files-found: error
          retention-days: 30

  # iOS (mit Apple-Watch-App): nur bauen, ohne Signatur.
  # Baut die Apple-Watch-App (Ziele „Watch“ und „WatchWidgets“) mit.
  ios:
    name: iOS build (no codesign)
    needs: [analyze-test, dart-packages]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      # Swift-Pakete (und ggf. pod install) laufen im Build automatisch.
      - name: Build iOS (release, no codesign)
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign 2>&1 | tee ios-build.log; then
            {
              echo "## iOS build failed"
              echo
              echo '```text'
              # Swift-/Xcode-Fehler zuerst, sonst das Ende des Logs
              if grep -nE 'error:|Error \(Xcode\)' ios-build.log >/dev/null 2>&1; then
                grep -nE -A3 'error:|Error \(Xcode\)' ios-build.log | head -n 120
              else
                tail -n 120 ios-build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:' ios-build.log | head -n 30 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '|' '/' | cut -c1-200)
              echo "::error::$safe"
            done
            exit 1
          fi

      - name: Upload iOS build log (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
